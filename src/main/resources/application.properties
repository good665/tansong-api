spring.application.name=reservation-api

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/reservation_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=final final f
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/*.xml

# ⚠️ XML 파서의 외부 DTD/Schema 읽기 제한을 해제하여 에러를 방지합니다.
spring.xml.jackson.use-xml-bom=true
System.setProperty.javax.xml.accessExternalDTD=all