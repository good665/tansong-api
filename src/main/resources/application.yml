# 공통 설정 (auth-v1 의 application.yml 을 이 파일로 교체)
# 기존 application.properties 에 있던 mybatis 설정은 그대로 유지하세요.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  # 메일 서버: SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD 를 설정하면 비밀번호 찾기가 켜짐 (없으면 503 안내)
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  sql:
    init:
      # 시작할 때마다 schema.sql 실행 (CREATE TABLE IF NOT EXISTS 만 있어서 여러 번 실행해도 안전)
      mode: always
      encoding: UTF-8

app:
  mail:
    from: ${MAIL_FROM:no-reply@seniorlife.invalid}
  oauth:
    # 제공자에 등록할 콜백: {public-base-url}/api/auth/oauth/{google|naver|kakao}/callback
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    # 웹 앱 복귀 주소 허용 목록 (쉼표로 구분, 정확히 일치해야 함). 앱 스킴은 코드에 고정
    web-redirects: ${OAUTH_WEB_REDIRECTS:http://localhost:8081/oauth-callback,http://127.0.0.1:8081/oauth-callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorize-url: ${GOOGLE_AUTHORIZE_URL:https://accounts.google.com/o/oauth2/v2/auth}
      token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
      user-info-url: ${GOOGLE_USER_INFO_URL:https://openidconnect.googleapis.com/v1/userinfo}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorize-url: ${NAVER_AUTHORIZE_URL:https://nid.naver.com/oauth2.0/authorize}
      token-url: ${NAVER_TOKEN_URL:https://nid.naver.com/oauth2.0/token}
      user-info-url: ${NAVER_USER_INFO_URL:https://openapi.naver.com/v1/nid/me}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorize-url: ${KAKAO_AUTHORIZE_URL:https://kauth.kakao.com/oauth/authorize}
      token-url: ${KAKAO_TOKEN_URL:https://kauth.kakao.com/oauth/token}
      user-info-url: ${KAKAO_USER_INFO_URL:https://kapi.kakao.com/v2/user/me}
  toss:
    # 토스페이먼츠 "API 개별 연동 키"(자동결제). 시크릿 키가 비어 있으면 모의 결제로 동작
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  public-data:
    # 공공데이터포털 API (장기요양기관 검색/상세, 법정동코드). 포털 계정 공통 인증키라 따로 없으면 국세청 키를 사용
    base-url: ${DATA_GO_KR_BASE_URL:https://apis.data.go.kr}
    service-key: ${DATA_GO_KR_SERVICE_KEY:${NTS_SERVICE_KEY:}}
  nts:
    # 공공데이터포털 국세청 사업자등록정보 진위확인 API (인증키는 포털의 Decoding 키)
    base-url: ${NTS_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1}
    service-key: ${NTS_SERVICE_KEY:}
  subscription:
    # 시설 상단노출(광고) 월 구독료 (원)
    monthly-price: ${SUBSCRIPTION_MONTHLY_PRICE:1000}
  upload:
    # 업로드된 시설 사진이 저장되는 폴더 (운영에서는 서버의 영구 저장소 경로로 지정)
    dir: ${UPLOAD_DIR:./uploads}
  reservation:
    # 같은 시간대에 받을 수 있는 방문 예약 수 (시설당)
    slot-capacity: ${RESERVATION_SLOT_CAPACITY:2}
  consultation:
    # 같은 시간대에 받을 수 있는 상담 신청 수 (시설당)
    slot-capacity: ${CONSULTATION_SLOT_CAPACITY:2}
  auth:
    # 브루트포스 방지: 이 횟수만큼 비밀번호를 틀리면 계정이 잠깁니다.
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    # 잠긴 계정이 자동으로 풀리기까지의 시간(분)
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}