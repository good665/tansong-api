# 공통 설정 (auth-v1 의 application.yml 을 이 파일로 교체)
# 기존 application.properties 에 있던 mybatis 설정은 그대로 유지하세요.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  sql:
    init:
      # 시작할 때마다 schema.sql 실행 (CREATE TABLE IF NOT EXISTS 만 있어서 여러 번 실행해도 안전)
      mode: always
      encoding: UTF-8

app:
  nts:
    # 공공데이터포털 국세청 사업자등록정보 진위확인 API (인증키는 포털의 Decoding 키)
    base-url: ${NTS_BASE_URL:https://api.odcloud.kr/api/nts-businessman/v1}
    service-key: ${NTS_SERVICE_KEY:}
  subscription:
    # 시설 상단노출(광고) 월 구독료 (원)
    monthly-price: ${SUBSCRIPTION_MONTHLY_PRICE:1000}
  upload:
    # 업로드된 시설 사진이 저장되는 폴더 (운영에서는 서버의 영구 저장소 경로로 지정)
    dir: ${UPLOAD_DIR:./uploads}
  reservation:
    # 같은 시간대에 받을 수 있는 방문 예약 수 (시설당)
    slot-capacity: ${RESERVATION_SLOT_CAPACITY:2}
  auth:
    # 브루트포스 방지: 이 횟수만큼 비밀번호를 틀리면 계정이 잠깁니다.
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    # 잠긴 계정이 자동으로 풀리기까지의 시간(분)
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}